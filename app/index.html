<!DOCTYPE HTML>
<html>

<head>
    <title> Project Preview </title>
    <script src="https://ui5.sap.com/1.136.9/resources/sap-ui-core.js" 
            id="sap-ui-bootstrap"
            data-sap-ui-theme="sap_horizon"
            data-sap-ui-bindingSyntax="complex" 
            data-sap-ui-xx-bindingSyntax="complex"
            data-sap-ui-resourceroots='{"assets": "assets"}' 
            data-sap-ui-libs="sap.m,sap.uxap,sap.ui.layout,sap.f">
    </script>
    <link rel="stylesheet" href="assets/preview.css">
</head>

<body id="body" class="sapUiBody">
    <script>
        "use strict";
        sap.ui.localResources("assets");
        (function (jQuery, App, Page) {
            sap.ui.getCore().attachInit(function () {
                sap.ui.define([
                    "sap/ui/core/mvc/Controller",
                    "sap/ui/model/json/JSONModel"
                ], function (Controller, JSONModel) {
                    return Controller.extend("PreviewController", {
                        onInit: function () {

                            // REPLACE YOUR EXISTING 'const data' WITH THIS:

const data = {
    "Services": [
        {
            "ServiceName": "ProcurementService",
            "DetailsURL": "./service/procurement/",
            "Metadata": "./service/procurement/$metadata",
            "Entities": [
                {
                    "Name": "Requisitions",
                    "URL": "./service/procurement/Requisitions",
                    "FioriURL": "$fiori-preview/ProcurementService/Requisitions#preview-app"
                },
                {
                    "Name": "CatalogItems",
                    "URL": "./service/procurement/CatalogItems",
                    "FioriURL": "$fiori-preview/ProcurementService/CatalogItems#preview-app"
                }
            ],
            "EntitiesCount": 2
        },
        // 1. Existing Service (Invoices)
        {
            "ServiceName": "cOE_DEMOSrv",
            "DetailsURL": "./service/cOE_DEMO/",
            "Metadata": "./service/cOE_DEMO/$metadata",
            "Entities": [
                {
                    "Name": "Invoices",
                    "URL": "./service/cOE_DEMO/Invoices",
                    "FioriURL": "$fiori-preview/cOE_DEMOSrv/Invoices#preview-app"
                }
            ],
            "EntitiesCount": 1
        }
        // 2. NEW Service (Procurement)
        
    ]
};
                            this.getView().setModel(new JSONModel(data));
                        }
                    });
                });
                var oApp = new App()
                var previewView = sap.ui.view({
                    viewName: "assets.Preview",
                    type: sap.ui.core.mvc.ViewType.XML
                });
                oApp.addPage(new Page({
                    content: [previewView],
                    showHeader: false
                })).placeAt("content");
            });

        }(jQuery, sap.m.App, sap.m.Page));
    </script>
    <div id="content"></div>
</body>

</html>
