<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Requisitions</title>
    <script id="sap-ui-bootstrap" src="https://ui5.sap.com/1.108.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon" data-sap-ui-resourceroots='{"coe.demo.requisitions": "./"}'
        data-sap-ui-compatVersion="edge" data-sap-ui-async="true" data-sap-ui-frameOptions="trusted">
        </script>
    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require([
                "sap/ushell/Container",
                "sap/m/Shell",
                "sap/ui/core/ComponentContainer"
            ], function (Container, Shell, ComponentContainer) {
                // Initialize the Container to load the FLP
                new Shell({
                    app: new ComponentContainer({
                        height: "100%",
                        name: "coe.demo.requisitions",
                        settings: {
                            id: "coe.demo.requisitions"
                        }
                    })
                }).placeAt("content");
            });
        });
    </script>
</head>

<body class="sapUiBody" id="content">
</body>

</html>
