_schema-version: 3.3.0
ID: COE_DEMO
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  # 1. BACKEND SERVICE
  - name: COE_DEMO-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: COE_DEMO-auth
      - name: COE_DEMO-db

  # 2. DATABASE DEPLOYER
  - name: COE_DEMO-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: COE_DEMO-db

  # 3. APPROUTER (THE LOGIN HANDLER)
  - name: COE_DEMO-router
    type: approuter.nodejs
    path: router
    parameters:
      disk-quota: 512M
      memory: 512M
    requires:
      - name: COE_DEMO-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  # AUTHENTICATION
  - name: COE_DEMO-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: COE_DEMO-${org}-${space}
        tenant-mode: dedicated

  # DATABASE
  - name: COE_DEMO-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared